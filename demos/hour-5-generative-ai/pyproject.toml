[project]
name = "ai900-hour5-generative-ai"
version = "1.0.0"
description = "AI-900 Hour 5: Generative AI & Azure OpenAI - Interactive Console Demo"
requires-python = ">=3.13"
dependencies = [
    "openai>=1.60.0",
    "python-dotenv>=1.0.0",
    "rich>=13.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
